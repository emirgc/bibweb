# Page vitrine /espaces/ : voir docs/REDACTION.md, section « Vitrines »
title: Espaces

banniere:
  titre: De l'espace pour réfléchir, découvrir et s'enrichir
  image: espaces
  cadrage: 40%

sections:
  - type: cartes-revelation
    titre: Des lieux qui s'adaptent à vos besoins
    texte: Besoin de concentration pour étudier? Un travail à faire en équipe? Nos bibliothèques sont aménagées pour faire cohabiter travail de groupe et étude en silence, avec ou sans réservation. Explorez nos espaces ou demandez conseil pour trouver le coin qui vous convient! Certaines bibliothèques offrent aussi des salles spécifiquement réservées aux étudiants et étudiantes des cycles supérieurs.
    lienTout:
      texte: Réserver une salle
      lien: https://calendrier.bib.umontreal.ca/r
      nouvelOnglet: true
    cartes:
      - titre: Salles de travail individuel
        image: ../images/salle-individuelle.webp
        bouton:
          texte: Réservez votre salle
          lien: https://calendrier.bib.umontreal.ca/r
      - titre: Cabines insonorisées
        image: ../images/cabine.webp
        bouton:
          texte: Réservez votre cabine
          lien: https://calendrier.bib.umontreal.ca/r
      - titre: Salles silencieuses
        image: ../images/salle-silencieuse.webp
        texte: |
          - Bibliothèque du campus de Laval
          - Bibliothèque de droit
          - Bibliothèque Marguerite-d'Youville
          - Bibliothèque de médecine vétérinaire
          - Bibliothèque Thérèse-Gouin-Décarie
          - Bibliothèque de la santé
      - titre: Salles de travail pour 3 à 4 personnes
        image: images/salle-equipe.webp
        bouton:
          texte: Réservez votre salle
          lien: https://calendrier.bib.umontreal.ca/r
      - titre: Salles de travail pour 4 à 8 personnes
        image: images/grande-salle-equipe.webp
        bouton:
          texte: Réservez votre salle
          lien: https://calendrier.bib.umontreal.ca/r
      - titre: Espaces d'innovation et de créativité
        image: images/realite-virtuelle.webp
        texte: |
          - Bibliothèque de Mathématiques et informatique
          - Bibliothèque Marguerite-d'Youville
        bouton:
          texte: Réservez votre salle
          lien: https://calendrier.bib.umontreal.ca/r
      - titre: Salles de travail individuel - cycles supérieurs
        image: images/cycle-sup.webp
        texte: Sous réservation, à la Bibliothèques des lettres et sciences humaines pour toutes les personnes des cycles supérieurs
        bouton:
          texte: Réservez votre salle
          lien: https://calendrier.bib.umontreal.ca/r
      - titre: Salle de travail - maîtrise en droit
        image: images/cycle-sup-droit-maitrise.webp
        texte: Salle située à la Bibliothèque de droit. Informez-vous au comptoir de la bibliothèque pour y accéder.
      - titre: Salle de travail - doctorat en droit
        image: images/cycle-sup-droit-doctorat.webp
        texte: Salle située à la Bibliothèque de droit. Informez-vous au comptoir de la bibliothèque pour y accéder.

  - type: cartes-revelation
    fond: bleu100
    id: bien-etre
    titre: On a votre bien-être à cœur
    texte: Une session universitaire, ça passe vite! On a parfois besoin d’une pause, de lire une BD pour le plaisir, de colorier un mandala entre deux séances d’étude. Vous trouverez en bibliothèque des collections axées sur le bien-être et la détente, des jeux, et même un cocon de micro-sieste!
    cartes:
      - titre: Cocon de micro-sieste
        image: images/cocon.webp
        texte: |
          - Bibliothèque de droit
          - Bibliothèque Thérèse-Gouin-Décarie
      - titre: Espaces de relaxation
        image: images/relaxation.webp
        texte: Disponibles dans presque toutes les bibliothèques
      - titre: Trousse pour petits visiteurs
        image: images/trousse-petits.webp
        texte: Disponible à la Bibliothèque de droit
      - titre: Collection bien-être
