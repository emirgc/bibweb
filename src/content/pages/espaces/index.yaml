  - type: onglets
    fond: jaune
    disposition: onglets
    onglets:
      - etiquette: Technologies créatives
        titre: L’art d’être à l’avant-garde
        id: lart-detre-a-lavant-garde
        texte: La création vous passionne? Bienvenue aux avant-gardistes! Impression 3D, réalité virtuelle, programmation informatique, broderie numérique, voilà tout l’éventail de nouvelles technologies que nous mettons au service de votre inventivité. Profitez-en!
        cartes:
          - titre: Impression 3D
            image: images/impression-3d.webp
            lien: https://studio.bib.umontreal.ca/creatives/impression3d/
            appel: En savoir plus
          - titre: Découpeuse vinyle
            image: images/decoupeuse-vinyle.webp
