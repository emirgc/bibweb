  - type: image-texte
    fond: vertFonce
    titre: Des lieux accessibles
    texte: La Bibliothèque des lettres et sciences humaines et la Bibliothèque Hubert-Reeves offrent chacune une salle mettant à votre disposition des équipements et des logiciels spécialisés afin d’adapter l’expérience en bibliothèque à vos besoins et de vous accompagner dans votre réussite.
    image: images/marguerite-youville-espace.webp
    bouton:
      texte: En savoir plus sur le Service Accessibilité
      lien: /service-accessibilite/

  - type: fiches-bibliotheques
