  - type: image-texte
    fond: bleu100
    titre: On parle de nous
    texte: |
      Les collections, les acquisitions et les projets de la bibliothèque suscitent l’intérêt bien au-delà du campus. Découvrez les articles, entrevues et reportages sur nos documents et projets, et les recherches qu’ils inspirent.

      Vous travaillez dans les médias et souhaitez réaliser un reportage sur la bibliothèque, découvrir ses collections ou rencontrer un membre de notre équipe? Communiquez avec l’[équipe des relations avec les médias de l’Université de Montréal](https://nouvelles.umontreal.ca/a-propos).
    image: ./images/vitrine-reliures.webp
    positionImage: gauche
    bouton:
      texte: Consulter la revue de presse
      lien: /nouvelles/?sujet=livres-rares

  - type: image-texte
    fond: vertFonce
    titre: Ressources complémentaires
    image: ./images/reliures-cuir.webp
    positionImage: droite
    texte: Vous souhaitez poursuivre votre exploration des collections ou préparer une visite à la bibliothèque? Le guide Livres rares et collections spéciales présente notre offre de services ainsi que des ressources numériques et des outils spécialisés. Il vous aide à repérer des documents, à explorer les fonds et à approfondir vos recherches dans le cadre de vos études, de votre enseignement ou de vos travaux de recherche.
    boutons:
      - texte: Consulter le guide Livres rares et collections spéciales
        lien: https://boite-outils.bib.umontreal.ca/trouver-evaluer/livres-rares-collections-speciales

