# Page vitrine / (accueil) : voir docs/REDACTION.md, section « Vitrines »
title: Les bibliothèques UdeM

banniere:
  titre: Curiosité illimitée
  image: accueil
  rechercheSofia: true
  sousTitre:
    - Emir Chouchane
    - Conseiller en médiation technologique

sections:
  - type: quoi-de-neuf
    id: quoi-de-neuf
    titre: Quoi de neuf
    nombre: 4

  - type: grille-elargissable
    fond: bleu100
    titre: Mille et une façons d’apprendre
    texte: Quels que soient vos besoins, vous découvrirez ici de multiples méthodes d’apprentissage facilement accessibles. Trouvez celle qui vous convient!
    cartes:
      - titre: Ressources et conseils préparés par nos spécialistes
        icone: bookmark-simple
        appel: Voir la boîte à outils
        lien: https://boite-outils.bib.umontreal.ca
      - titre: Capsules vidéos et webinaires
        icone: video
        appel: Accéder à YouTube
        lien: https://www.youtube.com/user/BibliothequesUdeM
      - titre: Service Accessibilité
        icone: person-simple-circle
        appel: En savoir plus sur le Service Accessibilité
        lien: /service-accessibilite/
      - titre: Soutien personnalisé avec nos spécialistes
        icone: users
        appel: Prendre rendez-vous
        lien: /nous-joindre/notre-equipe/
    bouton:
      texte: Découvrir les services pour la communauté étudiante
      lien: /etudes/

  - type: cartes-sections
    cartes:
      - fond: vertFonce
        titre: Tout le monde s’y retrouve
        texte: "Choisissez votre espace selon vos besoins du moment : horaires étendus, accès autonome, création numérique, travail en cabine silencieuse, salon de détente... Le réseau des bibliothèques de l’UdeM, c'est 14 bibliothèques avec chacune leur personnalité, leurs espaces et leurs petits plus."
        image: ./images/image-arret-bibliothecaire.webp
        bouton:
          texte: Découvrir nos espaces
          lien: /espaces/
      - fond: bleu100
        titre: Soutenir votre recherche pour aller plus loin
        texte: |
          Notre équipe de spécialistes s’affaire pour vous donner les moyens de faire vos recherches dans les meilleures conditions:

          - Libre accès
          - Publication savante
          - Gestion des données de recherche
          - Revues systématiques
          - etc.
        image: ./images/recherche-accueil.webp
        bouton:
          texte: Explorer les services pour la recherche
          lien: /recherche/
      - fond: bleuPrincipal
        titre: Partenaire en matière d'enseignement
        texte: Que ce soit en participant à vos cours par des formations ou par une implication dans StudiUM, en vous aidant à donner accès à de la documentation et à produire vos déclarations dans Savia, notre équipe est là pour vous appuyer dans votre enseignement.
        image: ./images/enseignement-accueil.webp
        bouton:
          texte: Découvrir les services pour l’enseignement
          lien: /enseignement/

  - type: image-texte
    titre: Découvrez nos pièces uniques
    texte: Nos collections spéciales forment de véritables laboratoires de recherche et de découverte. Parcourir les différents fonds, c’est découvrir le passé à travers nos livres rares et anciens, nos artefacts et nos collections d’images.
    image: ./images/collections-speciales-montage.webp
    positionImage: droite
    boutons:
      - texte: Explorer les collections spéciales
        lien: https://collections-speciales.bib.umontreal.ca/
      - texte: Découvrir la Bibliothèque des livres rares et collections spéciales
        lien: /espaces/blrcs/
        contour: true

  - type: image-fond
    image: ./images/engagement-accueil.webp
    cadrage: 15%
    titre: S’engager pour une science ouverte
    texte: Notre équipe est résolument engagée dans le développement d’un accès universel aux savoirs, par son soutien à la Politique sur le libre accès aux publications savantes et par le financement de la publication de monographies savantes en libre accès, sans parler du soutien à de multiples outils et initiatives.
    bouton:
      texte: Nos engagements
      lien: /engagements/
