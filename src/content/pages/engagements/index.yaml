# Page vitrine /engagements/ : voir docs/REDACTION.md, section « Vitrines »
title: Engagements
crumbLabel: Engagements

banniere:
  titre: Pour un monde équitable et durable
  image: engagements
  cadrage: 25%

sections:
  - type: cartes-revelation
    fond: bleu100
    titre: La science ouverte, notre conviction
    texte: |
      Selon l’UNESCO, la science ouverte vise à rendre la recherche scientifique de tous les domaines accessibles à tous les publics, au bénéfice des scientifiques et de la société dans son ensemble.

      En développant des infrastructures ouvertes et en facilitant l’accès aux savoirs scientifiques, notamment via le libre accès, les bibliothèques de l’UdeM participent activement à la démocratisation des savoirs et favorisent le dialogue entre différents systèmes de connaissance et acteurs de la société.

      Consulter [l'engagement des bibliothèques de l’UdeM en faveur de la science ouverte](/engagements/engagement-science-ouverte.pdf).
    cartes:
      - titre: Ambassadrices du libre accès
        icone: megaphone
        texte: Appui à la Politique de l’Université de Montréal sur le libre accès aux publications savantes, notamment par une offre de formation, par la promotion, par l’intégration à nos services-conseils et diverses autres initiatives.
      - titre: Financement de projets en libre accès
        icone: hand-coins
        texte: Dédication d’environ 2,5 % du budget annuel de documentation des bibliothèques au financement d’initiatives de publication en libre accès.
      - titre: Accès aux résultats et aux données de recherche
        icone: arrows-out
        texte: Accompagnement des équipes de recherche pour le partage des résultats et des données de recherche par des services de soutien au dépôt dans Papyrus et Borealis, les dépôts de l’UdeM, ou dans d’autres dépôts ouverts.
      - titre: Plateformes et contenus ouverts
        icone: lock-simple-open
        texte: Utilisation de la licence Creative Commons CC-By sur le code source des plateformes développées et sur les contenus produits par notre équipe dès que cela est possible. Plusieurs projets de numérisation visent également à élargir l’accès aux ressources.
      - titre: Soutien pour les ressources éducatives libres
        icone: graduation-cap
        texte: Soutien à l’utilisation et à la création de ressources éducatives ouvertes pour enrichir l’apprentissage.
      - titre: Ateliers Wikipédia
        icone: newspaper-clipping
        texte: Des ateliers d’initiation et de soutien à l’enrichissement de cette encyclopédie universelle, gratuite et accessible. [Pour en savoir plus](/engagements/ateliers-wiki/)

  - type: liste-liens
    titre: Soutien à la publication et à l’édition savante en libre accès
    liens:
      - titre: Soutien aux auteurs et aux autrices UdeM pour choisir les meilleures options
        description: Les bibliothécaires disciplinaires de l’UdeM accompagnent les auteurs et autrices dans le choix des options de publication en libre accès les mieux adaptées à leurs besoins. Contactez-les !
        lien: /nous-joindre/notre-equipe/
      - titre: Service gratuit d’hébergement de revues sur la plateforme OJS
        description: Nous offrons un soutien concret à l’édition savante en mettant à la disposition des responsables de revues un service gratuit d’hébergement sur la plateforme Open Journal Systems (OJS).
        lien: https://boite-outils.bib.umontreal.ca/c.php?g=730144&p=5329562
      - titre: Support aux revues de l’UdeM qui veulent passer au modèle de libre accès diamant
        description: Les bibliothèques de l’UdeM s’engagent activement à soutenir les revues qui adoptent le modèle du libre accès diamant, une approche sans frais de publication ou de consultation.
        lien: /recherche/diffuser/#soutien-aux-revues--diamant-
      - titre: Financement pour la publication de monographies par les auteurs et autrices UdeM
        description: Depuis 2021, les bibliothèques offrent un programme de financement pour la publication de monographies savantes en accès libre par des auteurs et autrices UdeM.
        lien: /recherche/diffuser/financement-monographie/

  - type: cartes-revelation
    fond: bleu100
    titre: L’équité, la diversité, l’inclusion et l’accessibilité au cœur de nos actions
    texte: L’accès aux savoirs dans leur diversité est au cœur de notre mission en tant que bibliothèque universitaire. Nous œuvrons à rendre nos collections, services et espaces inclusifs et accessibles, en accueillant la pluralité des perspectives et des besoins de nos communautés.
    couleurCartes: rose300
    cartes:
      - titre: Amélioration de l’accessibilité des lieux, ressources et services
        icone: person-simple-circle
        texte: Travail pour rendre accessibles nos ressources et services à toute la communauté UdeM, notamment grâce à notre Service Accessibilité, qui offre des locaux adaptés, des logiciels spécialisés, de la documentation adaptée et un soutien personnalisé.
      - titre: La lecture en cadeau
        icone: gift
        texte: Coordination avec la Librairie de l’UdeM de la campagne UdeM de collecte de livres jeunesse neufs pour la Fondation pour l’alphabétisation. Les livres recueillis sont remis à des enfants fréquentant des écoles et centres de la petite enfance de communautés autochtones inscrits au programme. [Pour en savoir plus](/engagements/lecture-cadeau/)
      - titre: Bibliothèques vivantes
        icone: chat-circle
        texte: Les bibliothèques vivantes sont des activités de partage des savoirs permettant d'échanger autrement, humainement et sans intermédiaire technologique. [Pour en savoir plus](/engagements/bibliotheques-vivantes/)
      - titre: Cellule de forces vives EDIA et Premiers Peuples
        icone: users-four
        texte: Groupe de codéveloppement chargé de recommander des actions et de piloter des projets à fort impact en lien avec l’équité, la diversité, l’inclusion, l’accessibilité et les Premiers Peuples.
      - titre: Inclusivité dans le développement et la mise en valeur des collections
        icone: book-open
        texte: Principes de développement et de mise en valeur des collections visant la représentation de la diversité dans nos collections, traduits notamment en une indexation enrichie, et au soutien à leur accessibilité.
      - titre: Soutien à la recherche documentaire en lien avec la santé des personnes 2SLGBTQIA+
        icone: rainbow
        texte: Guides d’orientation pour initier aux définitions, enjeux et meilleures pratiques cliniques avec ces populations en santé
      - titre: Initiatives pour le bien-être étudiant
        icone: flower-lotus
        texte: |
          - Implantation d’espaces de relaxation
          - Développement de collections bien-être et de détente
          - Installation de postes de travail actif et de luminothérapie

  - type: cartes-revelation
    titre: Soutien et valorisation des savoirs des Premiers Peuples
    disposition: compacte
    texte: Nous nous engageons à contribuer au soutien et à la valorisation des savoirs des Premiers Peuples. Ces actions s’inscrivent dans une volonté de décolonisation et de soutien à l’inclusion, en cohérence avec les principes du plan d’action *Place aux Premiers Peuples 2024-2029* de l'UdeM.
    couleurCartes: vertFonce
    cartes:
      - titre: Savoirs, savoir-faire autochtones et cursus universitaire
        icone: books
        texte: En cours de déploiement dans plusieurs disciplines de la Faculté des arts et sciences (FAS), cette initiative a pour objectif d’intégrer des sources d’information issues des Premiers Peuples aux cursus universitaires. Les bibliothèques y jouent le rôle clé d’identifier les savoirs et savoir-faire autochtones au sein des collections, de les organiser et de les transmettre à la Faculté pour qu’elle les rende accessibles via ses activités d’enseignement.
      - titre: Valoriser les collections Premiers Peuples sur le campus
        icone: books
        texte: "Pour améliorer la reconnaissance des perspectives, des savoirs et des savoir-faire autochtones, les bibliothèques se sont engagées, avec d’autres partenaires, dans une initiative à objectif triple : 1) définir les meilleures façons de mettre en valeur l'art, les savoirs, et les artéfacts autochtones présents au sein des collections universitaires 2) s'engager dans une réflexion éthique sur l'appropriation culturelle, la gouvernance des savoirs, et la possession d'artéfacts autochtones par l'Université et leur impact sur les relations avec les Premiers Peuples et les communautés, et 3) rendre plus accessibles les méthodologies autochtones en recherche et en enseignement et promouvoir leur plus-value."
      - titre: Décolonisation des vedettes-matière
        icone: pencil-line
        texte: Contribution au projet de décolonisation du répertoire de vedettes-matière de l’Université Laval, utilisé pour la description et le repérage des documents. Ce projet permettra à terme de remplacer le vocabulaire discriminatoire que contenait le répertoire par des mots justes et respectueux pour décrire les réalités touchant les Premiers Peuples.
      - titre: Acquisition de publications autochtones
        icone: books
        texte: Attention particulière portée à l’acquisition de publications écrite par des autrices et auteurs issus des Premiers Peuples ou portant sur des sujets liés aux réalités autochtones.

  - type: image-texte
    fond: bleu100
    titre: Vers une empreinte écologique réduite
    texte: |
      À l’heure où chaque geste compte pour préserver notre planète, nous nous engageons à explorer et adopter des pratiques pour réduire notre impact environnemental.

      Au printemps 2024, dans le but d’identifier nos priorités pour une transition écologique durable, nous avons entrepris une évaluation de notre empreinte carbone.
    image: images/empreinte.webp
    positionImage: gauche
    bouton:
      texte: Consulter le rapport
      lien: /engagements/rapport-GES-bibliotheques-UdeM-2024.pdf

  - type: icone-texte
    icone: head-circuit
    couleurIcone: rose300
    titre: Intelligence artificielle, une intégration éthique
    texte: Nous nous engageons à soutenir et à encourager un usage éthique et innovant de l’intelligence artificielle dans un contexte de recherche, d’enseignement et d’apprentissage. Nous voulons créer un environnement expérientiel où l’IA est mise au service de la collaboration, de la créativité et de l’accès équitable à la connaissance, tout en s’ancrant dans un cadre d’utilisation responsable. Nous avons adopté des principes directeurs pour guider les actions et formations portées par les bibliothèques en IA.
    couleurAccordeons: rose
    accordeons:
      - titre: Encourager un usage créatif et responsable de l’IA auprès de notre communauté
        texte: |
          Accompagner les membres de la communauté UdeM dans leur compréhension et leur usage de l’IA, en offrant de l’accompagnement, des services, des ressources et des outils pédagogiques adaptés.

          Placer la créativité et l’innovation au cœur de notre approche, en faisant la promotion de solutions d’IA responsables qui répondent véritablement aux attentes et qui enrichissent l’expérience des personnes utilisatrices.
      - titre: Soutenir un développement éthique de l’IA
        texte: Soutenir le développement d’une IA responsable par le biais de nos contenus, collections et pratiques, et contribuer ainsi à la création d’une culture de l’innovation en adéquation avec les valeurs institutionnelles.
      - titre: Respecter le principe de transparence
        texte: Utiliser l’IA dans nos outils de manière transparente, telle que préconisée par les lignes directrices institutionnelles.
      - titre: Favoriser un usage écoresponsable
        texte: Intégrer l’IA dans nos pratiques tout en évaluant son impact environnemental et en misant sur des approches durables.
      - titre: Assurer la protection de la vie privée
        texte: S’assurer de prendre en compte les éléments pouvant affecter la confidentialité des données personnelles dans le cadre législatif québécois et canadien.
      - titre: Respecter le droit d’auteur et la propriété intellectuelle
        texte: Respecter les cadres légaux en matière de droit d’auteur et de propriété intellectuelle.
      - titre: Privilégier l’équité, la diversité, l’inclusion et l’accessibilité
        texte: Promouvoir des applications de l’IA qui renforcent l’accessibilité de l’information et soutiennent les besoins variés des personnes qui l’utilisent, en particulier les communautés sous-représentées.
      - titre: Respecter le cadre réglementaire institutionnel
        texte: Assurer la conformité de notre offre avec le cadre réglementaire de l’Université de Montréal en intégrant les normes et directives sur l’intelligence artificielle et en nous assurant d’en informer notre communauté, lorsque pertinent.

  - type: cartes-revelation
    fond: bleu100
    titre: La science en français, notre singularité
    texte: |
      Nous mettons la langue française au cœur de nos actions, en soutien à la vision institutionnelle: être la plus influente université de langue française dans le monde.

      À travers nos actions, nous réaffirmons notre engagement envers la science en français et notre rôle moteur dans la préservation et la promotion de cette richesse culturelle et intellectuelle.
    cartes:
      - titre: Soutien à la recherche en français
        icone: megaphone
        texte: Soutien des équipes de recherche par la mise à disposition d’outils et de ressources francophones, notamment en portant une attention particulière à l’acquisition de documentation en français pour nos collections.
      - titre: Initiatives de francisation
        icone: hand-coins
        texte: Renforcer la présence du français dans les environnements universitaires scientifiques par la traduction et l’adaptation de notices de documents pour aider au référencement et au repérage de documentation en français et participer à la francisation de l’interface de la plateforme numérique Borealis.
      - titre: Rayonnement de la science en français
        icone: arrows-out
        texte: |
          Contribuer financièrement et collaborer au développement et à la gouvernance de la plateforme Érudit.

          Soutenir l’implantation du Réseau Circé: Réseau québécois de recherche et de mutualisation de services aux revues savantes québécoises de langue française.

          Offrir gratuitement une plateforme d’édition pour les revues de l’UdeM, OJS.
      - titre: Service d’adaptation documentaire
        icone: lock-simple-open
        texte: Adapter les documents de nos collections ou d’autres sources pour les personnes ayant une déficience perceptuelle, lorsqu’aucune version n’est disponible dans un format approprié. Nous pouvons ainsi augmenter l’accès à de la documentation en français, pour tous les membres de notre communauté.
