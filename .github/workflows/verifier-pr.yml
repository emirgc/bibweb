# Construit le site (astro build) pour chaque pull request vers main, dont
# celles qu'ouvre Decap CMS : une erreur de contenu (champ invalide,
# directive mal écrite) fait échouer la vérification avant la fusion.
#
# Pour bloquer la fusion d'une PR en échec : Settings > Branches > règle de
# main > « Require status checks to pass », vérification « Construire ».
name: Vérifier une pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verifier-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Astro 7 exige Node 22.22 ou plus récent (engines de package.json)
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Images optimisées du dernier déploiement (deployer-pages.yml), en
      # lecture seule : une PR ne remplace pas le cache de main
      - name: Récupérer les images optimisées
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro/assets
          key: images-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/**/*.avif', 'src/**/*.gif', 'astro.config.mjs') }}
          restore-keys: images-

      - name: Construire le site
        run: npm run build
        env:
          SITE_ENV: preprod
