# Construit le site (astro build) et le publie sur GitHub Pages, à chaque
# poussée sur main ou à la demande (onglet Actions, « Run workflow »).
#
# Prérequis, une seule fois : Settings > Pages > Build and deployment >
# Source : « GitHub Actions ».
#
# BASE_PATH : le site est publié dans un sous-dossier
# (https://emirgc.github.io/bibweb/) ; voir src/plugins/base-sous-dossier.mjs.
#
# SITE_ENV=preprod : le robots.txt interdit l'indexation (copie de travail du
# site officiel), et les adresses canoniques restent celles de
# bib.umontreal.ca (`site` dans astro.config.mjs).
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours va au bout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Astro 7 exige Node 22.22 ou plus récent (engines de package.json)
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Images déjà optimisées par Astro (avif, webp aux largeurs du site) :
      # sans ce cache, chaque build les reconvertit toutes. Après npm ci, qui
      # vide node_modules. Nouvelle clé quand une image ou la configuration
      # change ; restore-keys reprend alors le cache précédent, et seules les
      # nouvelles images sont converties.
      - name: Récupérer les images optimisées
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: images-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/**/*.avif', 'src/**/*.gif', 'astro.config.mjs') }}
          restore-keys: images-

      # Donne le sous-dossier de publication (/bibweb pour emirgc/bibweb)
      - name: Préparer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire le site
        run: npm run build
        env:
          SITE_ENV: preprod
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Connexion GitHub de Decap CMS : origine du site, où s'ouvre
          # admin/connexion.html, puis relais (workflow n8n « Decap CMS :
          # connexion GitHub » sur ordo.bib.umontreal.ca)
          DECAP_ORIGINE: ${{ steps.pages.outputs.origin }}
          DECAP_AUTH_URL: https://ordo.bib.umontreal.ca/webhook/decap/auth

      - name: Téléverser le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Déployer
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
