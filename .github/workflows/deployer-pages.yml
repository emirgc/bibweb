# Construit le site (astro build) et le publie sur GitHub Pages, à chaque
# poussée sur main ou à la demande (onglet Actions, « Run workflow »).
#
# Prérequis, une seule fois : Settings > Pages > Build and deployment >
# Source : « GitHub Actions ».
#
# BASE_PATH : le site est publié dans un sous-dossier
# (https://emirgc.github.io/bibweb/) ; voir src/plugins/base-sous-dossier.mjs.
#
# SITE_ENV=preprod : le robots.txt interdit l'indexation (copie de travail du
# site officiel), et les adresses canoniques restent celles de
# bib.umontreal.ca (`site` dans astro.config.mjs).
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; celui en cours va au bout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Astro 7 exige Node 22.22 ou plus récent (engines de package.json)
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Donne le sous-dossier de publication (/bibweb pour emirgc/bibweb)
      - name: Préparer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire le site
        run: npm run build
        env:
          SITE_ENV: preprod
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Téléverser le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Déployer
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
